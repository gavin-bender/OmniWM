capabilities = { network = ["api.notion.com"], purpose = "Reads your checklist and saves checkbox changes to its Notion page." }

[options.pageID]
type = "string"
title = "Notion checklist page link"
default = ""
maxLength = 4096

[options.minutes]
type = "number"
title = "Countdown duration (minutes)"
default = 10
min = 1
max = 180
step = 1
